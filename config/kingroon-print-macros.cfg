[gcode_macro PAUSE]
description: Pause once, retract if warm, and park if homed
rename_existing: PAUSE_BASE
variable_retracted: 0.0
variable_cooled_target: 0.0
variable_runout: False
gcode:
    {% if not printer.pause_resume.is_paused and (printer.virtual_sdcard.is_active or printer.print_stats.state == "printing") %}
        {% set head = printer.toolhead %}
        {% set retract = [0.0, [params.E|default(1.7)|float, 5.0]|min]|max if printer.extruder.can_extrude else 0.0 %}
        {% set lift = [0.0, [5.0, head.axis_maximum.z - head.position.z]|min]|max %}
        {% set park_dx = head.axis_minimum.x + 5.0 - head.position.x %}
        {% set park_dy = head.axis_minimum.y + 5.0 - head.position.y %}
        PAUSE_BASE
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE={retract}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=cooled_target VALUE=0.0
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=runout VALUE={params.RUNOUT|default(0)|int != 0}
        {% if head.homed_axes == "xyz" %}
            SAVE_GCODE_STATE NAME=KR_PARK
            G91
            M83
            M220 S100
            M221 S100
            {% if retract > 0 %}
                G1 E-{retract} F300
            {% endif %}
            {% if lift > 0 %}
                G1 Z{lift} F600
            {% endif %}
            {% if lift >= 1 %}
                G1 X{park_dx} Y{park_dy} F3600
            {% endif %}
            RESTORE_GCODE_STATE NAME=KR_PARK MOVE=0
        {% else %}
            SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE=0.0
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_KR_PAUSE_COOLDOWN DURATION=600
    {% endif %}

[delayed_gcode _KR_PAUSE_COOLDOWN]
gcode:
    {% if printer.pause_resume.is_paused and printer.print_stats.state == "paused" and printer.extruder.target > 0 %}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=cooled_target VALUE={printer.extruder.target|float}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
        RESPOND MSG="Nozzle cooled while paused. Resume will restore the target."
    {% endif %}

[gcode_macro RESUME]
description: Verify the filament and nozzle before resuming
rename_existing: RESUME_BASE
gcode:
    {% if not printer.pause_resume.is_paused %}
        {action_raise_error("Print is not paused")}
    {% elif printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Position lost. Resume blocked; cancel the print")}
    {% endif %}
    {% set saved = printer["gcode_macro PAUSE"] %}
    {% set sensor = printer["filament_switch_sensor FilamentSensor"] %}
    {% if saved.runout and sensor.enabled and not sensor.filament_detected %}
        {action_raise_error("Load filament through the runout sensor before resuming")}
    {% endif %}
    {% set target = printer.extruder.target or saved.cooled_target %}
    {% if not target and not printer.extruder.can_extrude %}
        {action_raise_error("Heat the nozzle before resuming")}
    {% elif target and target < printer.configfile.settings.extruder.min_extrude_temp %}
        {action_raise_error("Set the nozzle target for your material before resuming")}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_KR_PAUSE_COOLDOWN DURATION=0
    {% if target and (not printer.extruder.can_extrude or printer.extruder.temperature < target - 3) %}
        M109 S{target}
    {% elif target and not printer.extruder.target %}
        M104 S{target}
    {% endif %}
    {% if saved.retracted > 0 %}
        SAVE_GCODE_STATE NAME=KR_UNRETRACT
        M83
        M220 S100
        M221 S100
        G1 E{saved.retracted} F300
        RESTORE_GCODE_STATE NAME=KR_UNRETRACT MOVE=0
    {% endif %}
    RESUME_BASE{ " VELOCITY=%s" % (params.VELOCITY|float) if "VELOCITY" in params else "" }
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE=0.0
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=cooled_target VALUE=0.0
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=runout VALUE=False

[gcode_macro M600]
description: Pause for a manual filament change
gcode:
    PAUSE RUNOUT={params.RUNOUT|default(0)|int}
    RESPOND MSG="Change filament: UNLOAD, LOAD, purge if needed, then RESUME."

[gcode_macro CANCEL_PRINT]
description: Cancel the active job and turn off heaters and part cooling
rename_existing: CANCEL_PRINT_BASE
gcode:
    UPDATE_DELAYED_GCODE ID=_KR_PAUSE_COOLDOWN DURATION=0
    TURN_OFF_HEATERS
    M107
    CANCEL_PRINT_BASE
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE=0.0
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=cooled_target VALUE=0.0
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=runout VALUE=False
    SET_SKEW CLEAR=1
