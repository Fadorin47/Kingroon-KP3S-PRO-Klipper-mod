# Filament service. TEMP is optional and explicitly requests a material temperature.
[gcode_macro LOAD]
description: Feed filament to the nozzle, then purge
gcode:
    _KR_FILAMENT MODE=LOAD LENGTH={params.LENGTH|default(55)|float} SPEED={params.SPEED|default(2)|float} TEMP={params.TEMP|default(0)|float}

[gcode_macro UNLOAD]
description: Shape the tip and retract filament past the drive gears
gcode:
    _KR_FILAMENT MODE=UNLOAD LENGTH={params.LENGTH|default(75)|float} SPEED={params.SPEED|default(3)|float} TEMP={params.TEMP|default(0)|float}

[gcode_macro PURGE_FILAMENT]
description: Purge another short length of filament
gcode:
    _KR_FILAMENT MODE=PURGE LENGTH={params.LENGTH|default(10)|float} SPEED={params.SPEED|default(1.5)|float} TEMP={params.TEMP|default(0)|float}

[gcode_macro _KR_FILAMENT]
gcode:
    {% set mode = params.MODE %}
    {% set length = params.LENGTH|float %}
    {% set speed = params.SPEED|float %}
    {% set target = params.TEMP|float %}
    {% set extruder = printer.configfile.settings.extruder %}
    {% set max_length = [100, extruder.max_extrude_only_distance|float]|min %}
    {% set max_speed = [8, extruder.max_extrude_only_velocity|default(8)|float]|min %}
    {% if printer.virtual_sdcard.is_active or (printer.print_stats.state == "printing" and not printer.pause_resume.is_paused) %}
        {action_raise_error("Pause the print before moving filament")}
    {% elif printer.manual_probe.is_active %}
        {action_raise_error("Finish Z calibration first")}
    {% elif mode not in ["LOAD", "UNLOAD", "PURGE"] or not (1 <= length <= max_length and 0 < speed <= max_speed) %}
        {action_raise_error("Invalid filament length or speed")}
    {% elif target != 0 and not (extruder.min_extrude_temp <= target < extruder.max_temp) %}
        {action_raise_error("Invalid material temperature")}
    {% elif target == 0 and not printer.extruder.can_extrude %}
        {action_raise_error("Heat the nozzle for your material first, or specify TEMP")}
    {% endif %}
    {% if target > 0 %}
        M109 S{target}
    {% endif %}
    SAVE_GCODE_STATE NAME=KR_FILAMENT_SERVICE
    M220 S100
    M221 S100
    M83
    {% if mode == "LOAD" %}
        G1 E{length} F{speed*60}
        G1 E15 F90
    {% elif mode == "UNLOAD" %}
        G1 E4 F90
        M400
        G4 P350
        G1 E-{length} F{speed*60}
    {% else %}
        G1 E{length} F{speed*60}
    {% endif %}
    RESTORE_GCODE_STATE NAME=KR_FILAMENT_SERVICE MOVE=0
    M400
    {% if printer.pause_resume.is_paused %}
        UPDATE_DELAYED_GCODE ID=_KR_PAUSE_COOLDOWN DURATION=600
    {% endif %}
    {% if mode == "UNLOAD" %}
        RESPOND MSG="Gently remove filament by hand."
    {% else %}
        RESPOND MSG="Check the nozzle. Use PURGE_FILAMENT if needed."
    {% endif %}
