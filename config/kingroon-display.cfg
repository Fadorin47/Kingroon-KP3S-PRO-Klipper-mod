# EXPERIMENTAL: enable only after flashing the matching display firmware.
# Motherboard / MCU pin names, NOT BTT Pi GPIO numbering.
[fsmc_display]
bank: 1
rs_line: 16
address_setup: 15
data_setup: 30
reset_pin: PC6
backlight_pin: PD13
width: 240
height: 320
madctl: 0x00
controller: auto
init_on_ready: True

[fsmc_touch]
cs_pin: PA7
spi_bus: spi2
spi_speed: 1000000
deselect_pins: PB12
